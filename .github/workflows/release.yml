name: Release

on:
  push:
    tags: [ 'v*' ]

jobs:
  release:
    runs-on: windows-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup .NET 8
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x
        
    - name: Build & Publish
      run: |
        dotnet publish SecureGuard.csproj -c Release -r win-x64 --self-contained true -o publish/Release
        
    - name: Build Installer
      uses: innosetup/innosetup-actions@v2
      with:
        path: installer/SecureGuardSetup.iss
        options: /DMyAppVersion=${{ github.ref_name }}
        
    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        files: |
          SecureGuard-Setup-*.exe
        generate_release_notes: true
