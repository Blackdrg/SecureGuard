<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Support - SecureGuard</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', sans-serif; background: #0a0a0a; color: #fff; }
        header { background: #111; padding: 20px 50px; border-bottom: 1px solid #222; display: flex; justify-content: space-between; align-items: center; }
        .logo { font-size: 24px; font-weight: bold; color: #00d4ff; }
        .nav { display: flex; gap: 30px; }
        .nav a { color: #aaa; text-decoration: none; }
        .support { padding: 80px 50px; max-width: 800px; margin: 0 auto; }
        .title { text-align: center; font-size: 48px; margin-bottom: 20px; }
        .subtitle { text-align: center; color: #888; margin-bottom: 50px; font-size: 18px; }
        .contact-form { background: #111; padding: 40px; border-radius: 15px; }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; color: #aaa; }
        input, textarea, select { width: 100%; padding: 15px; background: #1a1a1a; border: 1px solid #333; border-radius: 8px; color: #fff; font-size: 16px; }
        textarea { height: 150px; resize: vertical; }
        .btn { padding: 15px 40px; background: #00d4ff; color: #000; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; width: 100%; }
        .options { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-bottom: 50px; }
        .option { background: #111; padding: 30px; border-radius: 10px; text-align: center; border: 1px solid #222; }
        .option-icon { font-size: 40px; margin-bottom: 15px; }
        .option h3 { margin-bottom: 10px; }
        .option p { color: #888; font-size: 14px; }
    </style>
</head>
<body>
    <header>
        <div class="logo">SecureGuard</div>
        <nav class="nav">
            <a href="index.html">Home</a>
            <a href="features.html">Features</a>
            <a href="pricing.html">Pricing</a>
            <a href="download.html">Download</a>
            <a href="login.html">Login</a>
        </nav>
    </header>
    <section class="support">
        <h1 class="title">Support Center</h1>
        <p class="subtitle">We're here to help you with any questions or issues.</p>
        <div class="options">
            <div class="option">
                <div class="option-icon">📧</div>
                <h3>Email Support</h3>
                <p>Response within 24 hours</p>
            </div>
            <div class="option">
                <div class="option-icon">💬</div>
                <h3>Live Chat</h3>
                <p>Available 24/7</p>
            </div>
            <div class="option">
                <div class="option-icon">📚</div>
                <h3>Knowledge Base</h3>
                <p>Browse articles</p>
            </div>
        <div class="contact-form">
            <h2 style="margin-bottom: 30px;">Contact Us</h2>
            <form>
                <div class="form-group">
                    <label>Your Name</label>
                    <input type="text" placeholder="Enter your name">
                </div>
                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" placeholder="Enter your email">
                </div>
                <div class="form-group">
                    <label>Category</label>
                    <select>
                        <option>Technical Support</option>
                        <option>Billing</option>
                        <option>Sales</option>
                        <option>Other</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Message</label>
                    <textarea placeholder="Describe your issue..."></textarea>
                </div>
                <button type="submit" class="btn">Send Message</button>
            </form>
        </div>
    </section>
</body>
</html>
