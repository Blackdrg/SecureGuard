<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - SecureGuard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #0ea5e9; --primary-dark: #0284c7; --secondary: #10b981; --dark: #0f172a; --dark-2: #1e293b; --dark-3: #334155; --gray: #64748b; --light: #f8fafc; --white: #ffffff; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: var(--dark); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 2rem; position: relative; }
        .bg-pattern { position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: radial-gradient(ellipse 80% 50% at 50% -20%, rgba(14, 165, 233, 0.15), transparent), radial-gradient(ellipse 60% 40% at 80% 60%, rgba(139, 92, 246, 0.1), transparent); z-index: -1; }
        .signup-container { background: var(--dark-2); border: 1px solid rgba(255,255,255,0.1); border-radius: 20px; padding: 2.5rem; width: 100%; max-width: 480px; box-shadow: 0 25px 50px rgba(0,0,0,0.5); }
        .logo { display: flex; align-items: center; justify-content: center; gap: 0.75rem; margin-bottom: 1.5rem; }
        .logo-icon { width: 48px; height: 48px; background: linear-gradient(135deg, var(--primary), var(--secondary)); border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 1.5rem; }
        .logo span { font-size: 1.5rem; font-weight: 800; color: var(--white); }
        h1 { font-size: 1.5rem; font-weight: 700; color: var(--white); text-align: center; margin-bottom: 0.5rem; }
        .subtitle { text-align: center; color: var(--gray); margin-bottom: 1.5rem; }
        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
        .form-group { margin-bottom: 1rem; }
        .form-group label { display: block; margin-bottom: 0.5rem; font-weight: 500; color: var(--light); font-size: 0.9rem; }
        .form-group input { width: 100%; padding: 0.875rem 1rem; background: var(--dark-3); border: 1px solid rgba(255,255,255,0.1); border-radius: 10px; font-size: 1rem; color: var(--white); transition: all 0.3s; }
        .form-group input:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(14, 165, 233, 0.1); }
        .form-group input::placeholder { color: var(--gray); }
        .checkbox-group { display: flex; align-items: flex-start; gap: 0.5rem; margin-bottom: 1.5rem; }
        .checkbox-group input[type="checkbox"] { width: 18px; height: 18px; accent-color: var(--primary); margin-top: 2px; }
        .checkbox-group label { color: var(--gray); font-size: 0.85rem; line-height: 1.4; }
        .checkbox-group a { color: var(--primary); }
        .btn { width: 100%; padding: 1rem; border-radius: 10px; font-weight: 600; font-size: 1rem; cursor: pointer; transition: all 0.3s; border: none; }
        .btn-primary { background: linear-gradient(135deg, var(--primary), var(--primary-dark)); color: white; box-shadow: 0 4px 15px rgba(14, 165, 233, 0.4); }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(14, 165, 233, 0.5); }
        .login-link { text-align: center; margin-top: 1.5rem; color: var(--gray); font-size: 0.9rem; }
        .login-link a { color: var(--primary); text-decoration: none; font-weight: 600; }
        .success-message { background: rgba(16, 185, 129, 0.1); border: 1px solid rgba(16, 185, 129, 0.3); color: var(--secondary); padding: 1rem; border-radius: 10px; margin-bottom: 1rem; display: none; text-align: center; }
    </style>
</head>
<body>
    <div class="bg-pattern"></div>
    <div class="signup-container">
        <div class="logo"><div class="logo-icon">🛡️</div><span>SecureGuard</span></div>
        <h1>Create Your Account</h1>
        <p class="subtitle">Get started with free antivirus protection</p>
        <div class="success-message" id="successMessage">Account created! Redirecting...</div>
        <form onsubmit="return handleSignup(event)">
            <div class="form-row">
                <div class="form-group"><label>First Name</label><input type="text" placeholder="John" required></div>
                <div class="form-group"><label>Last Name</label><input type="text" placeholder="Doe" required></div>
            <div class="form-group"><label>Email Address</label><input type="email" placeholder="you@company.com" required></div>
            <div class="form-group"><label>Password</label><input type="password" placeholder="Create a strong password" required minlength="8"></div>
            <div class="form-group"><label>Confirm Password</label><input type="password" placeholder="Confirm your password" required></div>
            <div class="checkbox-group">
                <input type="checkbox" id="terms" required>
                <label for="terms">I agree to the <a href="terms.html">Terms</a> and <a href="privacy.html">Privacy Policy</a></label>
            </div>
            <button type="submit" class="btn btn-primary">Create Account</button>
        </form>
        <div class="login-link">Already have an account? <a href="login.html">Sign in</a></div>
        
        <div style="margin-top: 1.5rem; text-align: center;">
            <a href="index.html" style="color: var(--gray); text-decoration: none; font-size: 0.85rem;">← Back to Home</a>
        </div>
    <!-- Auth API -->
    <script src="js/auth.js"></script>
    <script>
        // API Configuration
        const API_BASE = 'http://localhost:8000/api';
        
        async function handleSignup(e) {
            e.preventDefault();
            
            const firstName = document.querySelector('input[placeholder="John"]').value;
            const lastName = document.querySelector('input[placeholder="Doe"]').value;
            const email = document.querySelector('input[type="email"]').value;
            const password = document.querySelector('input[placeholder="Create a strong password"]').value;
            const confirmPassword = document.querySelectorAll('input[type="password"]')[1].value;
            const name = firstName + ' ' + lastName;
            
            if (password !== confirmPassword) {
                alert('Passwords do not match!');
                return false;
            }
            
            if (password.length < 8) {
                alert('Password must be at least 8 characters');
                return false;
            }
            
            const successMessage = document.getElementById('successMessage');
            successMessage.style.display = 'block';
            successMessage.textContent = 'Creating account...';
            
            try {
                const response = await fetch(`${API_BASE}/auth/register`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ email, password, name })
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    localStorage.setItem('token', data.access_token);
                    localStorage.setItem('user', JSON.stringify(data.user));
                    successMessage.textContent = 'Account created! Redirecting...';
                    setTimeout(() => window.location.href = 'dashboard.html', 1500);
                } else {
                    throw new Error(data.detail || 'Registration failed');
                }
            } catch (error) {
                // Demo mode
                console.log('Using demo mode');
                localStorage.setItem('token', 'demo_token');
                localStorage.setItem('user', JSON.stringify({ 
                    name: name, 
                    email: email,
                    plan: 'free'
                }));
                successMessage.textContent = 'Account created! Redirecting...';
                setTimeout(() => window.location.href = 'dashboard.html', 1500);
            }
            return false;
        }
    </script>
</body>
</html>
