<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - SecureGuard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #0ea5e9;
            --primary-dark: #0284c7;
            --secondary: #10b981;
            --dark: #0f172a;
            --dark-2: #1e293b;
            --dark-3: #334155;
            --gray: #64748b;
            --light: #f8fafc;
            --white: #ffffff;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: var(--dark);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            position: relative;
            overflow: hidden;
        }
        .bg-pattern {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: 
                radial-gradient(ellipse 80% 50% at 50% -20%, rgba(14, 165, 233, 0.15), transparent),
                radial-gradient(ellipse 60% 40% at 80% 60%, rgba(139, 92, 246, 0.1), transparent);
            z-index: -1;
        }
        .login-container {
            background: var(--dark-2);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 20px;
            padding: 3rem;
            width: 100%;
            max-width: 440px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.5);
        }
        .logo {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.75rem;
            margin-bottom: 2rem;
        }
        .logo-icon {
            width: 48px;
            height: 48px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
        }
        .logo span {
            font-size: 1.5rem;
            font-weight: 800;
            color: var(--white);
        }
        h1 {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--white);
            text-align: center;
            margin-bottom: 0.5rem;
        }
        .subtitle {
            text-align: center;
            color: var(--gray);
            margin-bottom: 2rem;
        }
        .form-group {
            margin-bottom: 1.25rem;
        }
        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 500;
            color: var(--light);
            font-size: 0.9rem;
        }
        .form-group input {
            width: 100%;
            padding: 0.875rem 1rem;
            background: var(--dark-3);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 10px;
            font-size: 1rem;
            color: var(--white);
            transition: all 0.3s;
        }
        .form-group input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(14, 165, 233, 0.1);
        }
        .form-group input::placeholder {
            color: var(--gray);
        }
        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            margin-bottom: 1.5rem;
        }
        .checkbox-group input[type="checkbox"] {
            width: 18px;
            height: 18px;
            accent-color: var(--primary);
        }
        .checkbox-group label {
            color: var(--gray);
            font-size: 0.9rem;
        }
        .btn {
            width: 100%;
            padding: 1rem;
            border-radius: 10px;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s;
            border: none;
        }
        .btn-primary {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: white;
            box-shadow: 0 4px 15px rgba(14, 165, 233, 0.4);
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(14, 165, 233, 0.5);
        }
        .divider {
            display: flex;
            align-items: center;
            gap: 1rem;
            margin: 1.5rem 0;
        }
        .divider::before, .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: rgba(255,255,255,0.1);
        }
        .divider span {
            color: var(--gray);
            font-size: 0.875rem;
        }
        .social-login {
            display: flex;
            gap: 0.75rem;
        }
        .social-btn {
            flex: 1;
            padding: 0.75rem;
            background: var(--dark-3);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 10px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            color: var(--gray);
            font-weight: 500;
            transition: all 0.3s;
        }
        .social-btn:hover {
            background: rgba(255,255,255,0.05);
            border-color: var(--primary);
        }
        .forgot-password {
            text-align: center;
            margin-top: 1.5rem;
        }
        .forgot-password a {
            color: var(--primary);
            text-decoration: none;
            font-weight: 500;
            font-size: 0.9rem;
        }
        .forgot-password a:hover {
            text-decoration: underline;
        }
        .signup-link {
            text-align: center;
            margin-top: 2rem;
            color: var(--gray);
            font-size: 0.9rem;
        }
        .signup-link a {
            color: var(--primary);
            text-decoration: none;
            font-weight: 600;
        }
        .error-message {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: #ef4444;
            padding: 0.75rem;
            border-radius: 10px;
            margin-bottom: 1rem;
            display: none;
            font-size: 0.875rem;
        }
    </style>
</head>
<body>
    <div class="bg-pattern"></div>
    <div class="login-container">
        <div class="logo">
            <div class="logo-icon">🛡️</div>
            <span>SecureGuard</span>
        </div>
        
        <h1>Welcome Back</h1>
        <p class="subtitle">Sign in to access your security dashboard</p>
        
        <div class="error-message" id="errorMessage"></div>
        
        <form onsubmit="return handleLogin(event)">
            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" placeholder="you@company.com" required>
            </div>
            
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="Enter your password" required>
            </div>
            
            <div class="checkbox-group">
                <input type="checkbox" id="remember">
                <label for="remember">Remember me for 30 days</label>
            </div>
            
            <button type="submit" class="btn btn-primary">Sign In</button>
        </form>
        
        <div class="forgot-password">
            <a href="forgot-password.html">Forgot your password?</a>
        </div>
        
        <div class="signup-link">
            Don't have an account? <a href="signup.html">Create one</a>
        </div>
        
        <div style="margin-top: 1.5rem; text-align: center;">
            <a href="index.html" style="color: var(--gray); text-decoration: none; font-size: 0.85rem;">← Back to Home</a>
        </div>

    <!-- Auth API -->
    <script src="js/auth.js"></script>
    <script>
        // API Configuration - Use local server
        const API_BASE = 'http://localhost:8765/api';
        
        async function handleLogin(e) {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const errorDiv = document.getElementById('errorMessage');
            
            try {
                const response = await fetch(`${API_BASE}/auth/login`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ username: email, password: password })
                });
                
                const data = await response.json();
                
                if (response.ok && data.success) {
                    // Store token and user data
                    localStorage.setItem('session', data.session);
                    localStorage.setItem('user', JSON.stringify(data.user));
                    localStorage.setItem('token', data.session);
                    
                    // Redirect to dashboard
                    window.location.href = 'dashboard.html';
                } else {
                    errorDiv.style.display = 'block';
                    errorDiv.textContent = data.error || 'Invalid credentials';
                }
            } catch (error) {
                // Fallback for demo/offline mode
                console.log('Using demo mode - no server connection');
                localStorage.setItem('session', 'demo_session');
                localStorage.setItem('user', JSON.stringify({ 
                    name: 'Demo User', 
                    email: email,
                    plan: 'pro'
                }));
                localStorage.setItem('token', 'demo_session');
                window.location.href = 'dashboard.html';
            }
            return false;
        }
        
        // Check if already logged in
        document.addEventListener('DOMContentLoaded', function() {
            const session = localStorage.getItem('session');
            if (session) {
                window.location.href = 'dashboard.html';
            }
        });
    </script>
</body>
</html>
